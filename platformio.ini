; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:mkrwifi1010]
platform = atmelsam
board = mkrwifi1010
framework = arduino
lib_deps=
    arduino-libraries/WiFiNINA @ ^1.8.14
    knolleary/PubSubClient @ ^2.8

; 0. Production Game Firmware
[env:game_production]
build_src_filter = +<main.cpp>


; TESTS
; 1. Random LED sequence, seeded with analog pin
[env:test_led_sequence]
build_src_filter = +<../test/test-random-seq.cpp>

; 2. Automated MQTT communication diagnostics
[env:test_mqtt]
build_src_filter = +<../test/test-mqtt.cpp>

; 3. Vespera pattern visualiser
[env:test_vespera_patterns]
build_src_filter = +<../test/test-vespera-patterns.cpp>

; 4. Hardware pin diagnostics
[env:test_hardware]
build_src_filter = +<../test/hardware-diagnostics.cpp>